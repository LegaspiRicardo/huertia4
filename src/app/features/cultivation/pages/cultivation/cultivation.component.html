<app-floating-menu></app-floating-menu>

<div class="min-h-dvh bg-[#F4F8F2] pb-32">
    <header class="px-6 pt-6">
        <h1
            class="text-2xl font-bold text-[#36523C]">
            Mis cultivos
        </h1>

        <p class="mt-2 text-gray-500">
            Aquí encontrarás todas las plantas que actualmente estás cultivando.
        </p>
    </header>

    <section
        class="mt-8 space-y-5 px-6">
        @for(cultivation of cultivations; track cultivation.id){
            <app-cultivation-card
                [cultivation]="cultivation"
                (selected)="openCultivation($event)">
            </app-cultivation-card>
        }
    </section>
</div>


<app-cultivation-modal

    [open]="showModal"

    [cultivation]="selectedCultivation"

    (close)="closeCultivation()">

</app-cultivation-modal>

<app-bottom-navbar></app-bottom-navbar>
