<button class="w-full rounded-3xl bg-white mb-4 text-left shadow transition hover:scale-[1.02] active:scale-95" (click)="open()">
    <div class="flex items-center gap-2">
        <img
            [src]="cultivation().image"
            [alt]="cultivation().plantName"
            class="h-36 w-36 rounded-2xl object-cover">
        <div class="flex-1">
            <h2 class="text-xl font-bold text-[#36523C]">
                {{ cultivation().nickname }}
            </h2>

            <p class="italic text-gray-500">
                {{ cultivation().scientificName }}
            </p>

            <div class="mt-5 flex flex-wrap gap-2">
                <span class="rounded-full bg-[#F4F8F2] px-3 py-1 text-sm">
                    📍 {{ cultivation().place }}
                </span>
            </div>

            <div class="mt-5 flex justify-between text-sm text-gray-500">
                <span>
                    📅 {{ cultivation().sowingDate }}
                </span>

                <span>
                    💧 {{ cultivation().lastWatering }}
                </span>
            </div>
        </div>
    </div>
</button>
