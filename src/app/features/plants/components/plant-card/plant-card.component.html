<div
    class="overflow-hidden rounded-3xl bg-white shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-xl">

    <!-- Imagen -->
    <div class="relative">

        <img
            [src]="plant().image"
            [alt]="plant().name"
            class="h-36 w-full object-cover">

        <!-- Estado -->
        @if(plant().cultivated){

            <span
                class="absolute right-2 top-2 rounded-full bg-green-600 px-3 py-1 text-xs font-semibold text-white">
                ✓
            </span>

        } @else {

            <span
                class="absolute right-2 top-2 rounded-full bg-gray-700 px-3 py-1 text-xs font-semibold text-white">
                Sin cultivar
            </span>

        }

    </div>

    <!-- Información -->
    <div class="space-y-1 px-4">

        <h2
            class="text-xl font-bold text-[#36523C]">
            {{ plant().name }}
        </h2>

        <p
            class="text-sm italic text-gray-500">
            {{ plant().scientificName }}
        </p>

        <div
            class=" flex items-center justify-between">
        </div>

    </div>

</div>
