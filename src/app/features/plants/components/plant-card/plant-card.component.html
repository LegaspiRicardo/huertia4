<div
    class="rounded-2xl bg-white p-2 shadow transition hover:scale-105">
    @if(plant().unlocked){
    <img
        [src]="plant().image"
        class="mx-auto h-20 w-full object-cover rounded-xl">
    }
    @else {

    <div
        class="flex h-20 items-center justify-center rounded-xl bg-gray-200">
        <img src="/candado.png" alt="" class="w-8 h-8">
    </div>
    }

    <h3
        class="mt-3 text-center font-semibold">
        {{ plant().unlocked ? plant().name : '???' }}
    </h3>

    <p
        class="text-center text-xs text-gray-500">
        {{ plant().unlocked ? plant().scientificName : 'Bloqueada' }}
    </p>

</div>
