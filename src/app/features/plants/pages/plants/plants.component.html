<app-floating-menu></app-floating-menu>

<div class="min-h-dvh bg-[#F4F8F2] pb-32">

    <header class=" top-0 bg-[#F4F8F2] px-6 py-4">

        <h1 class="text-2xl font-bold text-[#36523C] my-2">
            Enciclopedia
        </h1>

        <p class="mt-2 text-gray-500">
            Explora todas las especies disponibles.
        </p>

    </header>





    <section>
        <section class="px-6 my-4">
            <div
                class="flex items-center w-full max-w-xl mx-auto rounded-xl shadow-md border border-[#36523C]/30 bg-white overflow-hidden transition-all focus-within:ring-2 focus-within:ring-[#36523C]">

                <!-- Lupa como ícono fijo -->
                <span class="pl-4 text-gray-400">
                    <img src="lupaVerde.png" class="w-8 h-4" alt="">
                </span>

                <!-- Input de Búsqueda -->
                <input type="search" placeholder="Busca aquí..."
                    class="w-full px-3 py-2.5 text-sm text-gray-700 bg-transparent focus:outline-none placeholder:text-gray-400" />

                <!-- Separador sutil -->
                <div class="h-6 w-[1px] bg-gray-200"></div>

                <!-- Selector de Categorías -->
                <select name="categoria" id="categoria"
                    class="px-4 py-2.5 text-sm font-medium text-gray-600 bg-transparent border-none focus:outline-none cursor-pointer hover:text-[#36523C] transition-colors">
                    <option value="selecciona" disabled selected>Categoría</option>
                    <option value="todas">Todas</option>
                    <option value="arboles">Árboles</option>
                    <option value="frutales">Frutales</option>
                    <option value="medicinales">Medicinales</option>
                    <option value="hortalizas">Hortalizas</option>
                </select>

            </div>
        </section>
    </section>



    <section class="mt-8 grid grid-cols-2 gap-5 px-6">

        @for (plant of plants; track plant.id; let i = $index) {

        <app-plant-card [plant]="plant" (open)="openPlant(i)">
        </app-plant-card>

        }

    </section>

</div>


<app-plant-detail-modal [open]="showModal" [plants]="plants" [currentIndex]="selectedIndex" (close)="closePlant()">

</app-plant-detail-modal>


<app-bottom-navbar></app-bottom-navbar>
